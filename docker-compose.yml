version: "3.8"

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # веб-консоль (UI)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - minio_net

  s3-server:
    build: .
    ports:
      - "8080:8080"  # сервер Go 
    depends_on:
      - minio
    networks:
      - minio_net
    env_file:
      - .env   

networks:
  minio_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16   # подсеть (для решения локальной проблемы с переполненным пулом)

volumes:
  minio_data: